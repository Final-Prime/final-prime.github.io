name: Build clean Moonlight v003 final branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.head_ref == 'agent/mp-v003-text-sync'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_BRANCH: agent/mp-v003-final
      TEXT_SHA256: af431e552f750ea582bb27f9a44e6b2e1fb461d9fdd1263ba3baea002888d7fe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/mp-v003-text-sync
          fetch-depth: 0

      - name: Reconstruct and verify text packet
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mp-v003-text-payload/part-* > /tmp/mp-v003-text.b64
          base64 --decode /tmp/mp-v003-text.b64 > /tmp/mp-v003-text.tar.gz
          printf '%s  %s\n' "$TEXT_SHA256" /tmp/mp-v003-text.tar.gz | sha256sum --check --strict
          tar -tzf /tmp/mp-v003-text.tar.gz | sed '/\/$/d' | sort -u > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          assets/moonlight-peaks-dossier.css
          assets/moonlight-peaks-dossier.js
          assets/reviews/moonlight-peaks/README.md
          docs/moonlight-peaks-asset-manifest.md
          docs/moonlight-peaks-captures/MP-S01-CAPTURE-02.md
          docs/moonlight-peaks-captures/MP-S01-CAPTURE-03-AMENDMENT.md
          docs/moonlight-peaks-captures/MP-S01-CAPTURE-04.md
          docs/moonlight-peaks-captures/MP-S01-CAPTURE-05.md
          docs/moonlight-peaks-evidence-board.md
          docs/moonlight-peaks-polish-audit.md
          docs/moonlight-peaks-screenshot-atlas.md
          docs/moonlight-peaks-session-log.md
          docs/moonlight-peaks-sync-v003.md
          reviews/moonlight-peaks/index.html
          tools/check_moonlight_peaks_scaffold.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          mkdir -p /tmp/mp-v003-text
          tar -xzf /tmp/mp-v003-text.tar.gz -C /tmp/mp-v003-text

      - name: Build one clean commit from current main
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            git fetch origin main
            git fetch --force origin agent/mp-assets-probe:refs/remotes/origin/agent/mp-assets-probe
            git checkout -B "$FINAL_BRANCH" origin/main
            cp -a /tmp/mp-v003-text/. .
            git checkout origin/agent/mp-assets-probe -- \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-001__eye-customization__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-002__hairstyle-grid__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-003__clothing-selection__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-004__layered-accessories__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-005__final-character__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-006__train-message__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-007__dialogue-choices__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-008__arrival-with-dog__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-009__roof-negotiation__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-010__town-hall-portrait__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-011__synchronised-town-clock__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-012__glowing-ground-mark__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-013__northern-lake__web.png \
              assets/reviews/moonlight-peaks/curated/MP-SHOT-014__animals-for-sale-letter__web.png \
              assets/reviews/moonlight-peaks/raw/MP-SHOT-009__roof-negotiation__raw.png \
              assets/reviews/moonlight-peaks/social/moonlight-peaks-first-contact-og.png
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            python3 tools/check_editorial_style.py
            python3 tools/check_ip_notices.py
            python3 tools/check_review_registry.py
            python3 tools/check_moonlight_peaks_scaffold.py
            python3 tools/check_social_cards.py
            python3 tools/check_search_contract.py
            python3 tools/check_site_integrity.py
            python3 tools/check_security_contract.py
            python3 tools/check_accessibility_contract.py
            python3 tools/check_public_surface.py --history
            python3 tools/check_realops_registry.py
            git diff --check

            git add \
              assets/moonlight-peaks-dossier.css \
              assets/moonlight-peaks-dossier.js \
              assets/reviews/moonlight-peaks \
              docs/moonlight-peaks-asset-manifest.md \
              docs/moonlight-peaks-captures \
              docs/moonlight-peaks-evidence-board.md \
              docs/moonlight-peaks-polish-audit.md \
              docs/moonlight-peaks-screenshot-atlas.md \
              docs/moonlight-peaks-session-log.md \
              docs/moonlight-peaks-sync-v003.md \
              reviews/moonlight-peaks/index.html \
              tools/check_moonlight_peaks_scaffold.py
            git commit -m 'Sync Moonlight Peaks staging v003'
            git push --force origin HEAD:"$FINAL_BRANCH"
          } 2>&1 | tee /tmp/mp-v003-build.log

      - name: Report builder failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## Clean Moonlight v003 builder failure'
            echo
            echo '```text'
            if [ -f /tmp/mp-v003-build.log ]; then tail -220 /tmp/mp-v003-build.log; else echo 'No build log was produced.'; fi
            echo '```'
          } > /tmp/report.md
          gh pr comment 30 --body-file /tmp/report.md

      - name: Open clean final pull request
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if ! gh pr view "$FINAL_BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$FINAL_BRANCH" \
              --title 'Sync Moonlight Peaks staging v003' \
              --body-file - <<'EOF'
          ## Summary

          Drains the complete Moonlight Peaks v003 staging buffer into the public evidence-led dossier.

          ## Included

          - adversarial design, copy and layout polish;
          - MP-S01 Capture 02 through Capture 05;
          - fourteen retained screenshot derivatives with source hashes and proof limits;
          - updated session log, evidence board, screenshot atlas and asset manifest;
          - recurring 06:00 vampire return, Ridge's 50-to-40 wood negotiation, Dög's Cat Bed blueprint, Town Hall registration and photo workaround, auto-sell onboarding, radial control shortcut, exploration gates, Noel's fishing competition and Luna's animal-system introduction;
          - strengthened score-lock validation.

          ## Integrity

          The branch is one bot-noreply commit created directly from the then-current `main`. The text archive passed SHA-256 and exact 15-path allowlist verification, while all sixteen reused PNG blobs passed the repository PNG, social, security, accessibility and site-integrity checks on the validation branch. The public score, grade and buyer action remain withheld; `MP-S01` stays open.
          EOF
          fi
          gh pr view "$FINAL_BRANCH" --json number,url,headRefOid
